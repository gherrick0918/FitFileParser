name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Validate framework baseline
        run: |
          set -euo pipefail
          if grep -R --include='*.csproj' -nE 'net9\.0|net9\.0-android' src tests; then
            echo "Found .NET 9 target frameworks. Align projects with Directory.Build.props."
            exit 1
          fi
          required_targets=(
            '<TargetFramework>$(FitFileParserTargetFramework)</TargetFramework>'
            '<TargetFramework>$(FitFileParserAndroidTargetFramework)</TargetFramework>'
          )
          for target in "${required_targets[@]}"; do
            if ! grep -R --include='*.csproj' -qF "$target" src tests; then
              echo "Missing required centralized target framework: $target"
              exit 1
            fi
          done

      - name: Clean
        run: dotnet clean FitFileParser.slnx --configuration Release

      - name: Restore
        run: dotnet restore FitFileParser.slnx

      - name: Build
        run: dotnet build FitFileParser.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test FitFileParser.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
