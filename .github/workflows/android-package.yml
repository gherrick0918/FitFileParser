name: Android Package

on:
  workflow_dispatch:

jobs:
  package:
    name: Build Android Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore

      - name: Clean
        run: dotnet clean src/FitFileParser.AndroidApp/FitFileParser.AndroidApp.csproj --configuration Release

      - name: Restore
        run: dotnet restore src/FitFileParser.AndroidApp/FitFileParser.AndroidApp.csproj

      - name: Publish APK
        run: >
          dotnet publish src/FitFileParser.AndroidApp/FitFileParser.AndroidApp.csproj
          -c Release -f net10.0-android
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=/tmp/release.keystore
          -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}"
          -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}"
          -p:AndroidSigningStorePass="${{ secrets.ANDROID_STORE_PASSWORD }}"

      - name: Publish AAB
        run: >
          dotnet publish src/FitFileParser.AndroidApp/FitFileParser.AndroidApp.csproj
          -c Release -f net10.0-android
          -p:AndroidPackageFormat=aab
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=/tmp/release.keystore
          -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}"
          -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}"
          -p:AndroidSigningStorePass="${{ secrets.ANDROID_STORE_PASSWORD }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src/FitFileParser.AndroidApp/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: src/FitFileParser.AndroidApp/bin/Release/net10.0-android/publish/*.aab
          if-no-files-found: error
